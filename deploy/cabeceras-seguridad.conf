# Cabeceras de seguridad (RNF-003, Ley N.° 29733).
#
# Van en un archivo aparte porque en Nginx un add_header dentro de un location
# ANULA todos los del bloque server: sin este include, index.html y /assets/
# se servirían sin ellas.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# CSP: todo sale del mismo origen (JS, CSS y fuentes van en el build; la API,
# bajo /api). `img-src data:` es para exportar un gráfico a PNG (lib/export.js
# rasteriza el SVG desde una URL data:). Sin 'unsafe-inline' ni 'unsafe-eval':
# el build no trae <style> ni <script> en línea, y los estilos de React y de
# recharts se aplican por CSSOM, que la CSP no bloquea.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# El navegador solo la toma si llega por HTTPS (la que pone delante el proxy
# del servidor); por HTTP la ignora.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Aislamiento entre orígenes. require-corp funciona porque no se carga nada de
# otro origen: un recurso externo nuevo (CDN, fuentes…) quedaría bloqueado.
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
