# Cabeceras de seguridad (RNF-003, Ley N.° 29733).
#
# Van en un archivo aparte porque en Nginx un add_header dentro de un location
# ANULA todos los del bloque server: sin este include, index.html y /assets/
# se servirían sin ellas.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
