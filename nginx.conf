# Nginx del frontend SICEDU. Plantilla: ${API_UPSTREAM} se sustituye al arrancar
# el contenedor (ver Dockerfile). Las variables propias de Nginx van con $ y no
# se tocan, porque envsubst solo reemplaza las variables de entorno definidas.

# ── Métodos HTTP permitidos (alerta 40025 de ZAP, Proxy Disclosure) ────────
# TRACE y TRACK devuelven la petición tal cual y, con Max-Forwards, delatan cada
# proxy de la cadena: se rechazan en todo el servidor, también en /api, para
# que no lleguen al backend. Lo estático solo admite GET y HEAD; /api, además,
# los métodos que usa el frontend y que expone el backend (POST, PUT, PATCH).
map "$request_method:$uri" $metodo_rechazado {
    # Se recalcula en cada redirección interna: error_page pasa a GET la
    # petición rechazada y, con el valor en caché, la página 405 también
    # devolvería 405 y Nginx mostraría la suya.
    volatile;
    ~^(TRACE|TRACK):            1;
    ~^(GET|HEAD):               0;
    ~^(POST|PUT|PATCH):/api/    0;
    default                     1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Sin la versión de Nginx en la cabecera Server ni en las páginas de error.
    server_tokens off;

    # Redirecciones con ruta relativa (/assets → /assets/). Absolutas saldrían
    # con http:// y el puerto interno: Nginx no ve el HTTPS del proxy de delante.
    absolute_redirect off;

    if ($metodo_rechazado) {
        return 405;
    }

    # ── Páginas de error propias: no dicen qué servidor responde ────────────
    # Solo para los errores que genera Nginx: los de /api los devuelve el
    # backend tal cual (proxy_intercept_errors sigue apagado).
    error_page 404 /errores/404.html;
    error_page 405 /errores/405.html;
    error_page 500 502 503 504 /errores/50x.html;

    location ^~ /errores/ {
        internal;
        root /usr/share/nginx;
    }

    # ── Compresión: la conexión de los colegios ronda el 70 % (RN-017) ──────
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── Cabeceras de seguridad (RNF-003, Ley N.° 29733) ─────────────────────
    include /etc/nginx/snippets/cabeceras-seguridad.conf;

    # ── API bajo el mismo dominio con el prefijo /api (§11) ────────────────
    # El navegador nunca hace una petición de origen cruzado, así que no hace
    # falta CORS entre frontend y backend en producción.
    #
    # El destino va en una variable para que Nginx lo resuelva en cada petición
    # y no al arrancar. Con el destino fijo, Nginx no arranca si el backend aún
    # no existe ("host not found in upstream") y, si el backend se redespliega
    # y cambia de IP, sigue enviando a la vieja hasta que se reinicie.
    # NGINX_LOCAL_RESOLVERS lo rellena la imagen oficial desde /etc/resolv.conf
    # (NGINX_ENTRYPOINT_LOCAL_RESOLVERS en el Dockerfile).
    #
    # API_UPSTREAM es solo esquema, host y puerto, sin ruta al final.
    # ^~: la regla de archivos con extensión (más abajo) no se aplica a /api.
    location ^~ /api/ {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        set $api_upstream ${API_UPSTREAM};
        # Con una variable en proxy_pass el prefijo /api no se recorta solo.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        # El Host es el del backend, no el del frontend: si API_UPSTREAM es un
        # dominio público, el proxy de ese servidor enruta por este encabezado.
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # RNF-003: las respuestas con datos de alumnos no se guardan en caché.
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-store" always;
    }

    # ── Archivos con huella de contenido: caché larga e inmutable ──────────
    # Vite pone un hash en el nombre (index-a1b2c3.js): si cambia el archivo,
    # cambia el nombre, así que pueden guardarse un año sin riesgo.
    location ^~ /assets/ {
        expires 1y;
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── index.html nunca se cachea: es el que apunta a los assets nuevos ────
    location = /index.html {
        include /etc/nginx/snippets/cabeceras-seguridad.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Comprobación de vida para Docker y para el pipeline de Jenkins.
    location = /salud {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── Archivos ocultos (/.git/…, /.env, /._darcs…): siempre 404 ──────────
    # Sin esta regla, los que no tienen extensión caerían en index.html con
    # 200, y ZAP los reporta como repositorio o archivo oculto expuesto (40035).
    location ~ /\. {
        return 404;
    }

    # ── Archivos que no existen: 404, no index.html ─────────────────────────
    # Una ruta con extensión (/sitemap.xml, un .js o .map viejo…) pide un
    # archivo: si no está, se responde 404. Devolver index.html con 200 hace
    # creer que el archivo existe y tiene contenido HTML.
    location ~ \.[A-Za-z0-9]+$ {
        try_files $uri =404;
    }

    # ── Enrutamiento del lado del cliente ───────────────────────────────────
    # Cualquier ruta sin extensión (/dashboard, /estudiantes/12…) la resuelve
    # React Router: se devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
