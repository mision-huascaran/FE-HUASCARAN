# Análisis de SonarQube (ramas qa y uat, ver Jenkinsfile). La clave del proyecto
# hay que confirmarla con los TA.
sonar.projectKey=FE-HUASCARAN
sonar.projectName=FE-HUASCARAN
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/__tests__/**,**/*.test.js,**/*.test.jsx
sonar.exclusions=**/__tests__/**,src/test/**
# Informe que genera el stage de pruebas con Vitest.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# ── Reglas que no aplican a este proyecto ───────────────────────────────────
#
# Se excluyen AQUÍ y no desactivando la regla en el Quality Profile por dos
# razones: el perfil es compartido con los demás proyectos del servidor
# (ASCLA-QA, ASCLA-UAT…) y tocarlo afectaría a otros equipos; y así la decisión
# queda versionada en el repositorio, a la vista y reversible.
#
# S6774 «missing in props validation» exige declarar `prop-types` en cada
# componente. Este proyecto es JavaScript plano y no lleva esa dependencia: la
# regla sustituye a un sistema de tipos que aquí no se usa, no previene ningún
# fallo, y generaba 587 de los 716 avisos (el 82 %) repartidos por los 70
# componentes. Si algún día se adopta TypeScript o prop-types, quítese esto.
sonar.issue.ignore.multicriteria=propTypes
sonar.issue.ignore.multicriteria.propTypes.ruleKey=javascript:S6774
sonar.issue.ignore.multicriteria.propTypes.resourceKey=**/*
