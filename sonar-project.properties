# Análisis de SonarQube (ramas qa y uat, ver Jenkinsfile). La clave del proyecto
# hay que confirmarla con los TA.
sonar.projectKey=FE-HUASCARAN
sonar.projectName=FE-HUASCARAN
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/__tests__/**,**/*.test.js,**/*.test.jsx
sonar.exclusions=**/__tests__/**,src/test/**
# Informe que genera el stage de pruebas con Vitest.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
