# Análisis de SonarQube (ramas qa y uat, ver Jenkinsfile). La clave del proyecto
# hay que confirmarla con los TA.
sonar.projectKey=FE-HUASCARAN
sonar.projectName=FE-HUASCARAN
sonar.sourceEncoding=UTF-8

sonar.sources=src
# e2e/ son las pruebas E2E de Playwright: código de test, no de la aplicación.
sonar.tests=src,e2e
sonar.test.inclusions=**/__tests__/**,**/*.test.js,**/*.test.jsx,e2e/**
sonar.exclusions=**/__tests__/**,src/test/**
# Informe que genera el stage de pruebas con Vitest.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Fuera del cálculo de cobertura (pero SÍ analizados en busca de issues):
# el arranque de React y el simulador de la API, que no son lógica de la
# aplicación. Es la misma lista que `coverage.exclude` en vite.config.js.
sonar.coverage.exclusions=src/main.jsx,src/api/mock/**,e2e/**
