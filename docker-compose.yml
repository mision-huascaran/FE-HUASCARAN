# Frontend SICEDU. Lo levanta Jenkins en el servidor del curso con el .env del
# entorno (dev, qa o uat); ver .env.example, sección "Despliegue con Docker".
# Reglas del servidor: no se publica ningún puerto y no se levantan servicios
# adicionales. El contenedor se llama <entorno>-huascaran y escucha en el puerto
# 80; es el nombre por el que el proxy del servidor debe alcanzarlo.
#
# Las VITE_* se incrustan en el JavaScript al construir: cambiarlas exige
# reconstruir. API_UPSTREAM se lee al arrancar el contenedor.
services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
        VITE_AUTH_REAL: ${VITE_AUTH_REAL:-true}
    container_name: ${ENTORNO:-local}-huascaran
    environment:
      # El backend del mismo entorno (ver .env.example).
      API_UPSTREAM: ${API_UPSTREAM:?falta API_UPSTREAM en el .env}
    restart: unless-stopped
