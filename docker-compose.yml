# Frontend SICEDU. Lo levanta Jenkins en el servidor del curso con el .env del
# entorno (dev, qa o uat); ver .env.example, sección "Despliegue con Docker".
# Reglas del servidor: no se publica ningún puerto y no se levantan servicios
# adicionales. El proxy del servidor llega al contenedor por la red externa
# proxy_net, usando su nombre: <entorno>-huascaran, puerto 80.
#
# Las VITE_* se incrustan en el JavaScript al construir: cambiarlas exige
# reconstruir. API_UPSTREAM se lee al arrancar el contenedor.
#
# En local, crea la red una sola vez: docker network create proxy_net
services:
  frontend:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
        VITE_AUTH_REAL: ${VITE_AUTH_REAL:-true}
    container_name: ${ENTORNO:-local}-huascaran
    environment:
      # El backend del mismo entorno, por su nombre en proxy_net.
      API_UPSTREAM: ${API_UPSTREAM:-http://local-bck-huascaran:8000}
    networks:
      - proxy_net
    restart: unless-stopped

networks:
  proxy_net:
    external: true
